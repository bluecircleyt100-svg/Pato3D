<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pato 3D Girando</title>

<!-- Fuentes -->
<link href="https://fonts.googleapis.com/css2?family=Lobster&family=Bebas+Neue&display=swap" rel="stylesheet">

<style>
/* ===== FONDO DEGRADADO ANIMADO ===== */
body {
  margin: 0;
  height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  background: linear-gradient(
    270deg,
    #1e90ff,
    #ff8c00,
    #808080,
    #2ecc71
  );
  background-size: 800% 800%;
  animation: fondo 10s ease infinite;
  perspective: 1000px;
}

@keyframes fondo {
  0% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
  100% { background-position: 0% 50%; }
}

/* ===== TEXTO SUPERIOR ===== */
.titulo {
  font-family: 'Lobster', cursive;
  color: white;
  font-size: 48px;
  margin-bottom: 20px;
  text-shadow: 0 0 10px rgba(0,0,0,0.5);
}

/* ===== ESCENA 3D ===== */
.escena {
  width: 200px;
  height: 200px;
  transform-style: preserve-3d;
}

/* ===== PATO ===== */
.pato {
  font-size: 120px;
  transform-style: preserve-3d;
}

/* Giro 3D con traslación */
@keyframes girar3d {
  0% {
    transform: rotateY(0deg) translateZ(0px);
  }
  50% {
    transform: rotateY(180deg) translateZ(80px);
  }
  100% {
    transform: rotateY(360deg) translateZ(0px);
  }
}

/* ===== BOTÓN ===== */
button {
  margin-top: 40px;
  padding: 15px 40px;
  font-size: 28px;
  font-family: 'Bebas Neue', sans-serif;
  border: none;
  border-radius: 12px;
  cursor: pointer;
  color: white;
  transition: background 0.3s, transform 0.2s;
}

button:active {
  transform: scale(0.95);
}

.btn-stop {
  background: red;
}

.btn-start {
  background: green;
}
</style>
</head>

<body>

<div class="titulo">PATO </div>

<div class="escena">
  <div class="pato" id="pato">🦆</div>
</div>

<button id="btn" class="btn-stop">Finalizar</button>

<script>
const pato = document.getElementById("pato");
const btn = document.getElementById("btn");

let girando = true;

/* === FUNCIÓN ROBUSTA PARA INICIAR GIRO === */
function iniciarGiro() {
  pato.style.animation = "none";   // borra animación
  pato.offsetHeight;               // fuerza reflow (FIX QuickEdit)
  pato.style.animation = "girar3d 3s linear infinite";
  pato.style.animationPlayState = "running";

  btn.textContent = "Finalizar";
  btn.className = "btn-stop";
  girando = true;
}

/* SIEMPRE ARRANCA GIRANDO AL CARGAR */
window.onload = iniciarGiro;

/* BOTÓN INICIAR / FINALIZAR */
btn.addEventListener("click", () => {
  if (girando) {
    pato.style.animationPlayState = "paused";
    btn.textContent = "Iniciar";
    btn.className = "btn-start";
    girando = false;
  } else {
    iniciarGiro();
  }
});
</script>

</body>
</html>
